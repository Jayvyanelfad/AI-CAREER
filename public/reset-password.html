<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="theme.js"></script>
  <script src="i18n.js"></script>
<title>Reset Password - CareerPath AI</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="dashboard-container auth-recovery-page">
    <section class="auth-box" aria-labelledby="reset-title">
      <p class="profile-eyebrow">ACCOUNT ACCESS</p>
      <h1 id="reset-title">Choose a new password</h1>
      <p id="reset-status" role="status" aria-live="polite">Checking your password reset link…</p>
      <form id="reset-password-form" hidden>
        <div class="form-group">
          <label for="new-password">New password</label>
          <input id="new-password" type="password" autocomplete="new-password" minlength="6" required />
        </div>
        <div class="form-group">
          <label for="confirm-new-password">Confirm new password</label>
          <input id="confirm-new-password" type="password" autocomplete="new-password" minlength="6" required />
        </div>
        <button id="reset-password-submit" class="btn-primary" type="submit">Update password</button>
      </form>
      <a id="reset-login-link" href="login.html" hidden>Return to login</a>
    </section>
  </main>
  <script src="supabase-config.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
