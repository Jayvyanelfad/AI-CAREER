<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="theme.js"></script>
  <script src="i18n.js"></script>
<title>Course Detail - CareerPath AI</title>
    <meta name="description" content="Detailed view of a course with modules and lessons.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* Inline fallback for any overrides */
        .course-detail-container { max-width: 1200px; margin: 0 auto; padding: var(--space-6); }
        .course-detail-header { text-align: left; margin-bottom: var(--space-6); }
        .course-detail-image { width: 100%; height: 300px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: var(--space-8); }
        .course-detail-title { font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 3.5rem); font-weight: 100; color: var(--bege_light); margin-bottom: var(--space-4); }
        .course-detail-description { color: var(--green_light); font-size: 1.125rem; line-height: 1.6; margin-bottom: var(--space-8); }
        .course-detail-meta { display: flex; gap: var(--space-6); flex-wrap: wrap; justify-content: center; margin-bottom: var(--space-8); }
        .course-detail-meta span { display: flex; align-items: center; gap: var(--space-2); font-size: 0.9rem; color: var(--text-muted); }
        .course-detail-progress { margin: var(--space-4) 0; }
        .progress-label { display: flex; justify-content: space-between; margin-bottom: var(--space-2); font-size: 0.9rem; color: var(--bege_light); }
        .progress-bar { height: 8px; background: var(--border-light); border-radius: var(--radius-full); overflow: hidden; }
        .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--green_light), var(--bege)); border-radius: var(--radius-full); transition: width 0.3s ease; }
        .course-detail-modules { margin-top: var(--space-6); }
        .module-title { font-family: var(--font-display); font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 100; color: var(--bege_light); margin-bottom: var(--space-4); padding-top: var(--space-8); border-top: 1px solid var(--border-light); }
        .lesson-item { display: flex; align-items: center; padding: var(--space-4); background: rgba(13, 43, 33, 0.4); border-radius: var(--radius-sm); margin-bottom: var(--space-2); cursor: pointer; transition: var(--transition); }
        .lesson-item:hover { background: rgba(13, 43, 33, 0.6); }
        .lesson-item.completed { opacity: 0.7; }
        .lesson-item.completed .lesson-text { text-decoration: line-through; }
        .lesson-number { flex: 0 0 40px; font-size: 0.9rem; color: var(--green_light); }
        .lesson-text { flex: 1; font-size: 1rem; color: var(--bege_light); }
        .lesson-status { flex: 0 0 30px; text-align: right; font-size: 0.8rem; }
        .lesson-status.completed { color: var(--success); }
        .lesson-status.incomplete { color: var(--danger); }
        .lesson-content-area { margin-top: var(--space-8); padding: var(--space-6); background: rgba(13, 43, 33, 0.3); border-radius: var(--radius-md); border: 1px solid var(--border-light); }
        .lesson-content-title { font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 100; color: var(--bege_light); margin-bottom: var(--space-4); }
        .lesson-content-module { color: var(--green_light); font-size: 0.9rem; margin-bottom: var(--space-2); }
        .lesson-content-text { line-height: 1.7; color: var(--bege_light); }
        .lesson-actions { display: flex; gap: var(--space-4); margin-top: var(--space-6); flex-wrap: wrap; }
        .btn-lesson { flex: 1; min-width: 120px; }
        .btn-lesson:disabled { opacity: 0.5; cursor: not-allowed; }
        .empty-state { text-align: center; padding: var(--space-24); color: var(--text-muted); }
        .empty-state-icon { font-size: 4rem; margin-bottom: var(--space-8); opacity: 0.5; }
        @media (max-width: 768px) {
            .course-detail-image { height: 200px; }
            .course-detail-title { font-size: clamp(2rem, 5vw, 2.5rem); }
        }
    </style>
</head>
<body>
    <!-- ===== NAVIGATION ===== -->
    <div class="nav-wrapper-absolute">
        <div class="navbar">
            <div class="container">
                <div class="nav-wrapper">
                    <a href="index.html" aria-current="page" class="w--current">
                        <span class="text-h6" style="font-size: 1.5rem; color: var(--bege_light);">
                            <em>CareerPath</em> AI
                        </span>
                    </a>
                    <div class="div-block-2" style="display: flex; gap: 4px; align-items: center;">
                        <a href="index.html" class="text-menu color-bege_light nav-item w--current">Home</a>
                        <a href="career-test.html" class="text-menu color-bege_light nav-item">Career Test</a>
                        <a href="courses.html" class="text-menu color-bege_light nav-item">Courses</a>
                        <a href="dashboard.html" class="text-menu color-bege_light nav-item">Dashboard</a>
                        <a href="index.html#about" class="text-menu color-bege_light nav-item">About</a>
                    </div>
                    <div class="menu-button w-nav-button">
                        <i class="fas fa-bars" style="color: var(--bege_light); font-size: 1.25rem;"></i>
                    </div>
                    <a href="login.html" class="header-book-link-buttom">
                        <div class="text-button">Login</div>
                        <i class="fas fa-arrow-right" style="font-size: 0.8rem;"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <!-- ===== COURSE DETAIL CONTENT ===== -->
    <section class="section">
        <div class="course-detail-container container">
            <!-- Back to Courses -->
            <div style="margin-bottom: var(--space-4);">
                <a href="courses.html" class="text-button" style="color: var(--bege_light);">&laquo; Back to Courses</a>
            </div>

            <!-- Course Header -->
            <div class="course-detail-header" id="course-header">
                <!-- Loading placeholder -->
                <div class="empty-state">
                    <div class="empty-state-icon"><i class="fas fa-spinner fa-spin"></i></div>
                    <p>Loading course...</p>
                </div>
            </div>

            <!-- Progress -->
            <div class="course-detail-progress" id="course-progress">
                <div class="progress-label">
                    <span>Progress</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar"><div id="progress-fill" style="width: 0%"></div></div>
            </div>

            <!-- Exam Button (if applicable) -->
            <div id="exam-button-container"></div>

            <!-- Modules List -->
            <div class="course-detail-modules" id="course-modules">
                <!-- Modules will be inserted here -->
            </div>

            <button type="button" class="component-button hidden" id="btn-back-to-curriculum" aria-label="Back to course curriculum">
                &larr; Back to Curriculum
            </button>

            <!-- Lesson Content Area -->
            <div class="lesson-content-area hidden" id="lesson-content">
                <div class="empty-state">
                    <div class="empty-state-icon"><i class="fas fa-book-open"></i></div>
                    <p>Select a lesson to view its content.</p>
                </div>
            </div>

            <!-- Lesson Navigation & Actions -->
            <div class="lesson-actions hidden" id="lesson-actions">
                <button id="btn-prev-lesson" class="btn-lesson component-button">Previous Lesson</button>
                <button id="btn-mark-complete" class="btn-lesson component-button">Mark as Complete</button>
                <button id="btn-next-lesson" class="btn-lesson component-button">Next Lesson</button>
            </div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <div class="container footer-wrapper" style="padding-top: var(--space-16);">
        <div style="text-align: center; margin-bottom: var(--space-8);">
            <span class="text-h2" style="font-size: clamp(3rem, 8vw, 6rem); opacity: 0.15; color: var(--bege_light); letter-spacing: 0.2em;">CAREERPATH</span>
        </div>
        <footer class="footer-content">
            <div class="footer-block">
                <span class="text-footer color-bege_light" style="display: block; opacity: 0.6;">B.Tech Final Year Project</span>
            </div>
            <div class="footer-block" style="text-align: center;">
                <div class="text-footer color-bege_light" style="opacity: 0.7;">© CareerPath AI</div>
            </div>
            <div class="footer-block" style="text-align: right;">
                <span class="text-footer color-bege_light" style="opacity: 0.6;">Symbiosis Institute of Technology, Pune</span>
            </div>
        </footer>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth-navigation.js"></script>
    <script src="courses.js"></script>
    <script src="course-detail.js"></script>
    <script>

        const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -50px 0px' };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, observerOptions);
        document.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));
    </script>
</body>
</html>
