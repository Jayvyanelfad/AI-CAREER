<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rate Content</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Rate Content</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="enroll.html">Enroll</a>
        <a href="help.html" class="highlight">Help</a>
        <a href="ratecontent.html" class="highlight">Rate Content</a>
        <a href="contactus.html" class="highlight">Contact Us</a>
      </nav>
    </header>

    <main class="rate-main">
      <h2>How was the content?</h2>
      <p>Your feedback helps us improve and grow 💬</p>

      <form id="rate-form">
        <div class="rating-stars">
          <span class="star" data-value="1"><i class="fas fa-star"></i></span>
          <span class="star" data-value="2"><i class="fas fa-star"></i></span>
          <span class="star" data-value="3"><i class="fas fa-star"></i></span>
          <span class="star" data-value="4"><i class="fas fa-star"></i></span>
          <span class="star" data-value="5"><i class="fas fa-star"></i></span>
        </div>

        <input type="hidden" id="rating" name="rating" />

        <label for="feedback">Your Feedback:</label>
        <textarea id="feedback" name="feedback" placeholder="Tell us what you think..."></textarea>

        <button type="submit">Submit</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2025 Personal Development Academy. All rights reserved.</p>
    </footer>
  </div>

  <script>
    const stars = document.querySelectorAll(".star");
    const ratingInput = document.getElementById("rating");

    stars.forEach(star => {
      star.addEventListener("click", () => {
        const value = star.getAttribute("data-value");
        ratingInput.value = value;
        highlightStars(value);
      });
    });

    function highlightStars(value) {
      stars.forEach(star => {
        const starValue = star.getAttribute("data-value");
        if (starValue <= value) {
          star.classList.add("selected");
        } else {
          star.classList.remove("selected");
        }
      });
    }

    document.getElementById("rate-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const rating = ratingInput.value;
      const feedback = document.getElementById("feedback").value;

      if (!rating && !feedback.trim()) {
        return alert("⚠️ Please give a rating or write feedback before submitting.");
      }

      try {
        const res = await fetch('http://localhost:3000/api/ratecontent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating, feedback })
        });

        if (!res.ok) throw new Error('Failed to submit feedback');
        alert("✅ Thank you! Your feedback has been received.");
        document.getElementById("rate-form").reset();
        highlightStars(0);
      } catch (err) {
        console.error(err);
        alert("❌ Could not send feedback. Please try again.");
      }
    });
  </script>
  <script src="chatbot.js" defer></script>

</body>
</html>
