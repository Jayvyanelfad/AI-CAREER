<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script src="theme.js"></script>
  <script src="i18n.js"></script>
<title>Sign Up - CareerPath AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" data-i18n-aria-label="coverage.toggleThemeAria">
    <i class="fas fa-moon moon-icon"></i>
    <i class="fas fa-sun sun-icon"></i>
  </button>

  <header>
    <div class="logo"><a href="index.html">CareerPath <em>AI</em></a></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="courses.html">Career Courses</a>
      <a href="career-test.html">Career Test</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="contactus.html">Contact</a>
      <button class="cta-button" onclick="location.href='login.html'">Get Started</button>
    </nav>
  </header>

  <main class="dashboard-container auth-page-shell">
    <aside class="auth-editorial-panel auth-editorial-panel--register" aria-hidden="true"></aside>
    <div class="auth-editorial-copy"><p class="editorial-eyebrow">START WITH CURIOSITY</p><h2>Your next chapter starts here.</h2><p>Explore new paths and turn your interest in technology into practical momentum.</p></div>
    <div class="auth-box">
      <h1>Start Your AI Career Journey</h1>
      <div id="error-message" class="error-message" style="display:none;"></div>
      <div id="signup-feedback-actions" hidden style="text-align:center;margin:0 0 1rem;">
        <button type="button" id="resend-confirmation-btn" class="auth-google-button" hidden>Resend confirmation email</button>
        <p><a href="login.html">Go to Login</a></p>
      </div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" name="name" type="text" placeholder="John Doe" data-i18n-placeholder="coverage.fullNamePlaceholder" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="form-group password-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Create a strong password" required autocomplete="new-password" />
          <button type="button" class="password-toggle" aria-label="Show password" data-i18n-aria-label="coverage.showPasswordAria" aria-pressed="false">Show</button>
        </div>

        <div class="form-group password-group">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your password" required />
          <button type="button" class="password-toggle" aria-label="Show confirm password" data-i18n-aria-label="coverage.showConfirmPassword" aria-pressed="false">Show</button>
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">
          <span class="btn-text">Create Account</span>
          <span class="spinner hidden" aria-hidden="true"><i class="fas fa-spinner fa-spin"></i></span>
        </button>
      </form>

      <div class="divider">or</div>

      <button type="button" id="google-signin-btn" class="auth-google-button">
        <i class="fab fa-google"></i> Continue with Google
      </button>
      <div id="google-signin-message" style="text-align:center;margin-top:10px;"></div>

      <p style="text-align:center; margin-top:var(--space-4); color:var(--green_light);">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </main>

  <script src="supabase-config.js"></script>
  <script src="register.js"></script>
  <script src="auth-navigation.js"></script>
</body>
</html>
