<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signing you in... - CareerPath AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
    <i class="fas fa-moon moon-icon"></i>
    <i class="fas fa-sun sun-icon"></i>
  </button>

  <main class="dashboard-container" style="max-width: 400px; margin: 0 auto; padding: var(--space-4); min-height: calc(100vh - 120px); display: flex; align-items: center; justify-content: center; flex-direction: column;">
    <div class="dashboard-card" style="text-align: center; padding: var(--space-8);">
      <div class="spinner" style="font-size: 3rem; margin-bottom: var(--space-4); color: var(--bege);"></div>
      <p id="status-message" style="color: var(--bege_light); font-size: 1.25rem;">Signing you in...</p>
    </div>
  </main>

  <script src="supabase-config.js"></script>
  <script src="auth-callback.js"></script>
</body>
</html>
