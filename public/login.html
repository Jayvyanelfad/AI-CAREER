<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log In - CareerPath AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
    <i class="fas fa-moon moon-icon"></i>
    <i class="fas fa-sun sun-icon"></i>
  </button>

  <header>
    <div class="logo"><i class="fas fa-robot"></i> AI Career Platform</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="courses.html">Career Courses</a>
      <a href="career-test.html">Career Test</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="contactus.html">Contact</a>
      <button class="cta-button" onclick="location.href='register.html'">Get Started</button>
    </nav>
  </header>

  <main class="dashboard-container" style="max-width: 440px; margin: 0 auto; padding: var(--space-4); min-height: calc(100vh - 120px);">
    <div class="auth-box">
      <h1>Welcome Back</h1>
      <div id="error-message" class="error-message" style="display:none;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group password-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
          <span class="password-toggle"><i class="fas fa-eye"></i></span>
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">
          <span class="btn-text">Log In</span>
          <span class="spinner hidden"><i class="fas fa-spinner fa-spin"></i></span>
        </button>
      </form>

      <div class="divider">or</div>

      <button type="button" id="google-signin-btn" class="btn-primary" style="background:#fff; color:#333; border:1px solid #ddd; display:flex; align-items:center; justify-content:center; gap:10px;">
        <i class="fab fa-google"></i> Continue with Google
      </button>
      <div id="google-signin-message" style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: var(--space-2);"></div>

      <p>Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
  </main>

  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
