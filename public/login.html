<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log In - CareerPath AI</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <main class="login-container">
    <div class="login-box">
      <h1>Welcome Back</h1>
      <div id="error-message" class="error-message" style="display:none;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group password-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
          <span class="password-toggle"><i class="fas fa-eye"></i></span>
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">
          <span class="btn-text">Log In</span>
          <span class="spinner hidden"><i class="fas fa-spinner fa-spin"></i></span>
        </button>
      </form>

      <div class="divider">or</div>

      <div id="google-signin-container" style="display: flex; justify-content: center; margin: var(--space-6) 0;"></div>
      <div id="google-signin-message" style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: var(--space-2);"></div>

      <p>Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
  </main>

  <!-- FIXED: Removed type="module" -->
  <script src="login.js"></script>
</body>
</html>
