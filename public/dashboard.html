<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script src="theme.js"></script>
  <script src="i18n.js"></script>
<title>Dashboard - CareerPath AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" style="width: 40px; height: 40px; border-radius: 50%; background-color: var(--bege_light); color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; transition: var(--transition); margin-left: auto;">
    <i class="fas fa-moon moon-icon"></i>
    <i class="fas fa-sun sun-icon"></i>
  </button>

  <header>
    <div class="logo">
      <a href="index.html" class="text-h6" style="font-size: 1.5rem; color: var(--bege_light);">
        <em>CareerPath</em> AI
      </a>
    </div>
    <nav>
      <a href="index.html" class="text-menu color-bege_light nav-item" data-i18n="nav.home" data-i18n-fallback="Home">Home</a>
      <a href="courses.html" class="text-menu color-bege_light nav-item" data-i18n="nav.courses" data-i18n-fallback="Career Courses">Career Courses</a>
      <a href="career-test.html" class="text-menu color-bege_light nav-item" data-i18n="nav.careerTest" data-i18n-fallback="Career Test">Career Test</a>
      <a href="dashboard.html" class="text-menu color-bege_light nav-item w--current" data-i18n="nav.dashboard" data-i18n-fallback="Dashboard">Dashboard</a>
      <a href="profile.html" class="text-menu color-bege_light nav-item" data-i18n="nav.profile" data-i18n-fallback="Profile">Profile</a>
    </nav>
  </header>

  <main class="dashboard-section">
    <div class="container">
    <!-- Greeting Section -->
    <section class="greeting-section">
      <p class="editorial-eyebrow" data-i18n="page.dashboardEyebrow" data-i18n-fallback="YOUR CAREER + LEARNING JOURNEY">YOUR CAREER + LEARNING JOURNEY</p>
      <h1>Welcome back, <span id="user-name">Learner</span>!</h1>
      <p id="career-goal" class="dashboard-career-goal"></p>
      <p id="dashboard-message" style="color: var(--text-muted); margin-bottom: var(--space-4);"></p>
      <div class="quick-actions" style="display: flex; gap: var(--space-4); margin-top: var(--space-6); flex-wrap: wrap;">
        <button class="quick-action-btn component-button" id="take-career-test-btn" data-i18n="ui.takeCareerTest" data-i18n-fallback="Take Career Test">Take Career Test</button>
        <button class="quick-action-btn component-button" id="explore-courses-btn" data-i18n="ui.exploreCourses" data-i18n-fallback="Explore Courses">Explore Courses</button>
        <button class="quick-action-btn component-button" id="view-profile-btn" data-i18n="nav.profile" data-i18n-fallback="View Profile">View Profile</button>
      </div>
    </section>

    <!-- Stats Cards -->
    <div class="stats-grid" id="stats-grid">
      <!-- Stats will be populated here -->
    </div>

    <!-- Career Test Summary -->
    <section class="career-section" id="career-section">
      <h3><i class="fas fa-star"></i> Career Insights</h3>
      <div id="career-summary">
        <!-- Career summary will be populated here -->
      </div>
    </section>

    <!-- Enrolled Courses -->
    <section class="courses-section" id="courses-section">
      <h3><i class="fas fa-book"></i> My Courses</h3>
      <div id="courses-grid">
        <!-- Courses will be populated here -->
      </div>
    </section>

    <section class="courses-section" id="certificates-section">
      <h3><i class="fas fa-award"></i> My Certificates</h3>
      <div id="certificates-grid" class="certificates-grid" aria-live="polite">
        <p class="text-muted" data-i18n="page.loadingCertificates" data-i18n-fallback="Loading certificates...">Loading certificates...</p>
      </div>
    </section>

    <!-- Timeline Milestone -->
    <section class="timeline-section" id="timeline-section">
      <h3><i class="fas fa-road"></i> Your Journey</h3>
      <div class="timeline" id="timeline-container">
        <!-- Timeline items will be populated here -->
      </div>
    </section>

    <!-- Recent Activity Feed -->
    <section class="activity-section" id="activity-section">
      <h3><i class="fas fa-clock"></i> Recent Activity</h3>
      <div class="activity-feed" id="activity-feed">
        <!-- Activity items will be populated here -->
      </div>
    </section>
  </div>
  </main>

  <!-- Floating Chatbot Button -->
  <div class="floating-chatbot" id="floating-chatbot" title="Chat with CareerPath AI">
    <i class="fas fa-robot"></i>
  </div>

  <footer>
    <p>© CareerPath AI · B.Tech Final Year Project</p>
  </footer>

  <script src="supabase-config.js"></script>
  <script src="dashboard.js"></script>
  <script src="auth-navigation.js"></script>
</body>
</html>
